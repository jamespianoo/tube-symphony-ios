# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen
#   xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: TubeSymphony
options:
  bundleIdPrefix: com.jamesbeckwith
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en-GB

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.31.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple team ID here (Xcode → Settings → Accounts), or pick it in
    # Signing & Capabilities after generating.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TubeSymphony:
    type: application
    platform: iOS
    sources:
      - path: TubeSymphony
    dependencies:
      - package: MapLibre
    info:
      path: TubeSymphony/Info.plist
      properties:
        CFBundleDisplayName: Tube Symphony
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: [youtube]
        UIAppFonts:
          - ChicagoFLF.ttf
          - Fraunces-600.ttf
          - RobotoMono-400.ttf
          - RobotoMono-700.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamesbeckwith.tubesymphony
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  TubeSymphonyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TubeSymphonyTests
    dependencies:
      - target: TubeSymphony
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TubeSymphony:
    build:
      targets:
        TubeSymphony: all
        TubeSymphonyTests: [test]
    test:
      targets: [TubeSymphonyTests]
